<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/studentCSS.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
    }

    .main-content {
        margin-left: 80px;
        padding: 30px;
        transition: margin-left 0.3s ease;
        width: calc(100% - 80px);
    }

    .sidebar:hover + .main-content {
        margin-left: 250px;
        width: calc(100% - 250px);
    }

    .table-box {
        background: #ffffff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    h2 {
        font-weight: 700;
    }

    .table td,
    .table th {
        vertical-align: middle;
    }

    .table tbody tr:hover {
        background-color: rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

<div th:replace="fragments/studentSidebar :: studentSidebar"></div>

<div class="main-content">

  <div class="container">

    <div class="table-box">

      <h2 class="text-center mb-4">
        📚 My Requests
      </h2>

      <div class="table-responsive">

        <table class="table table-bordered table-hover text-center">

          <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Book Title</th>
            <th>Status</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="request, stat : ${requests}">

            <td th:text="${stat.count}"></td>

            <td th:text="${request.book.name}"></td>

            <td>
                            <span th:text="${request.status}"
                                  class="badge"
                                  th:classappend="${request.status == 'Pending' ? 'bg-warning' :
                                  (request.status == 'Approved' ? 'bg-success' : 'bg-danger')}">
                            </span>
            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
