<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Borrow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/adminCSS.css}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
        }

        .main-content {
            margin-left: 80px;
            padding: 30px;
            transition: margin-left 0.3s ease;
            width: calc(100% - 80px);
        }

        .sidebar:hover + .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .table-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        h2 {
            font-weight: 700;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div th:replace="fragments/adminSidebar :: adminSidebar"></div>

<div class="main-content">

    <div class="container">

        <div class="table-box">

            <h2 class="text-center mb-4">
                Borrow Records
            </h2>

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead class="table-dark">
                    <tr>
                        <th>Borrow ID</th>
                        <th>Book Name</th>
                        <th>Student Name</th>
                        <th>Borrow Date</th>
                        <th>Due Date</th>
                        <th>Return Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="borrow : ${borrowList}">

                        <td th:text="${borrow.id}"></td>

                        <td th:text="${borrow.book.name}"></td>

                        <td th:text="${borrow.student.name}"></td>

                        <td th:text="${borrow.borrowDate}"></td>

                        <td th:text="${borrow.dueDate}"></td>

                        <td th:text="${borrow.returnDate != null ? borrow.returnDate : 'Not Returned'}"></td>

                        <td th:text="${borrow.returnDate == null ? 'Pending' : 'Returned'}"></td>

                        <td>
                            <div class="d-flex flex-column gap-2">

                                <form th:action="@{/admin/returnBook/{id}(id=${borrow.id})}"
                                      method="POST">

                                    <button class="btn btn-success btn-sm w-100">
                                        <i class="fas fa-check"></i>
                                        Returned
                                    </button>

                                </form>

                                <form th:action="@{/admin/deleteBorrow/{id}(id=${borrow.id})}"
                                      method="POST">

                                    <button class="btn btn-danger btn-sm w-100">
                                        <i class="fas fa-trash"></i>
                                        Delete
                                    </button>

                                </form>

                            </div>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
