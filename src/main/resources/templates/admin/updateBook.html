<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/adminCSS.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }

        .main-content {
            margin-left: 80px;
            padding: 30px;
            transition: margin-left 0.3s ease;
            width: calc(100% - 80px);
        }

        /* Sidebar hover support */
        .sidebar:hover + .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .form-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        h2 {
            font-weight: 700;
        }

        label {
            font-weight: 500;
        }
    </style>
</head>
<body>

<div th:replace="fragments/adminSidebar :: adminSidebar"></div>

<div class="main-content">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-9">

                <div class="form-box">

                    <h2 class="text-center mb-4">
                        Update Book
                    </h2>

                    <form enctype="multipart/form-data"
                          method="post"
                          th:action="@{/saveBook}"
                          th:object="${book}">

                        <input type="hidden"
                               name="id"
                               th:value="${book.id}" />

                        <div class="mb-3 row">
                            <label for="name"
                                   class="col-sm-2 col-form-label">
                                Name
                            </label>

                            <div class="col-sm-10">
                                <input type="text"
                                       class="form-control"
                                       id="name"
                                       name="name"
                                       placeholder="Enter book name"
                                       th:value="${book.name}">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="author"
                                   class="col-sm-2 col-form-label">
                                Author
                            </label>

                            <div class="col-sm-10">
                                <input type="text"
                                       class="form-control"
                                       id="author"
                                       name="author"
                                       placeholder="Enter author name"
                                       th:value="${book.author}">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="description"
                                   class="col-sm-2 col-form-label">
                                Description
                            </label>

                            <div class="col-sm-10">
                                <input type="text"
                                       class="form-control"
                                       id="description"
                                       name="description"
                                       placeholder="Write book description"
                                       th:value="${book.description}">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="price"
                                   class="col-sm-2 col-form-label">
                                Price
                            </label>

                            <div class="col-sm-10">
                                <input type="number"
                                       class="form-control"
                                       id="price"
                                       name="price"
                                       placeholder="Enter book price"
                                       th:value="${book.price}">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="quantity"
                                   class="col-sm-2 col-form-label">
                                Quantity
                            </label>

                            <div class="col-sm-10">
                                <input type="number"
                                       class="form-control"
                                       id="quantity"
                                       name="quantity"
                                       placeholder="Enter book quantity"
                                       th:value="${book.quantity}">
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="category"
                                   class="col-sm-2 col-form-label">
                                Category
                            </label>

                            <div class="col-sm-10">
                                <select id="category"
                                        name="category"
                                        class="form-select">

                                    <option th:each="categoryOption : ${categories}"
                                            th:value="${categoryOption}"
                                            th:text="${categoryOption}"
                                            th:selected="${categoryOption == book.category}">
                                    </option>

                                </select>
                            </div>
                        </div>

                        <div class="mb-4 row">
                            <label for="date"
                                   class="col-sm-2 col-form-label">
                                Date
                            </label>

                            <div class="col-sm-10">
                                <input type="date"
                                       class="form-control"
                                       id="date"
                                       name="date"
                                       required
                                       th:value="${book.date}">
                            </div>
                        </div>

                        <div class="text-center">
                            <button class="btn btn-primary px-4"
                                    type="submit">
                                Update Book
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
