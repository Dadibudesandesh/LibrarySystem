<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update User</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/adminCSS.css}">

    <style>
        body {
            margin: 0;
            background-color: #f5f6fa;
        }

        .main-content {
            margin-left: 80px;
            padding: 30px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div th:replace="fragments/adminSidebar :: adminSidebar"></div>

<div class="main-content">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="form-box">

                    <h3 class="text-center mb-4">
                        Update User
                    </h3>

                    <form method="post"
                          th:action="@{/saveUpdatedUser}"
                          th:object="${user}">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Password
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{password}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Mobile
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{mobile}"
                                   maxlength="10"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Gender
                            </label>

                            <div>
                                <input type="radio"
                                       th:field="*{gender}"
                                       value="male"> Male

                                <input type="radio"
                                       th:field="*{gender}"
                                       value="female"
                                       class="ms-3"> Female

                                <input type="radio"
                                       th:field="*{gender}"
                                       value="other"
                                       class="ms-3"> Other
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Role
                            </label>

                            <select class="form-select"
                                    th:field="*{role}">

                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:text="${r}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Status
                            </label>

                            <select class="form-select"
                                    th:field="*{status}">

                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s}">
                                </option>

                            </select>
                        </div>

                        <div class="text-center">
                            <button type="submit"
                                    class="btn btn-primary">
                                Update User
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
