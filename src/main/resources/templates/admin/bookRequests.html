<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Requests</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/adminCSS.css}">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
    }

    .main-content {
        margin-left: 80px;
        padding: 30px;
        transition: margin-left 0.3s ease;
        width: calc(100% - 80px);
    }

    /* Sidebar hover support */
    .sidebar:hover + .main-content {
        margin-left: 250px;
        width: calc(100% - 250px);
    }

    .table-container {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    h2 {
        font-weight: 700;
    }

    .table td,
    .table th {
        vertical-align: middle;
    }
  </style>
</head>
<body>

<div th:replace="fragments/adminSidebar :: adminSidebar"></div>

<div class="main-content">

  <div class="container">

    <div class="table-container">

      <h2 class="text-center mb-4">
        📚 Book Requests
      </h2>

      <div class="table-responsive">

        <table class="table table-bordered table-hover">

          <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Student Name</th>
            <th>Book Title</th>
            <th>Student ID</th>
            <th>Book ID</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="request, stat : ${requests}">

            <td th:text="${stat.count}"></td>

            <td th:text="${request.student.name}"></td>

            <td th:text="${request.book.name}"></td>

            <td th:text="${request.student.id}"></td>

            <td th:text="${request.book.id}"></td>

            <td>
                            <span th:text="${request.status}"
                                  class="badge"
                                  th:classappend="${request.status == 'Pending' ? 'bg-warning' :
                                  (request.status == 'Approved' ? 'bg-success' : 'bg-danger')}">
                            </span>
            </td>

            <td>
              <div class="d-flex gap-2">

                <form th:action="@{/approve-request/{id}(id=${request.id})}"
                      method="post">

                  <button type="submit"
                          class="btn btn-success btn-sm">
                    <i class="fas fa-check"></i>
                    Approve
                  </button>

                </form>

                <form th:action="@{/reject-request/{id}(id=${request.id})}"
                      method="post">

                  <button type="submit"
                          class="btn btn-danger btn-sm">
                    <i class="fas fa-times"></i>
                    Reject
                  </button>

                </form>

              </div>
            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
