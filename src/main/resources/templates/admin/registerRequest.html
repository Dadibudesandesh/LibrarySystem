<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Registration Requests</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/adminCSS.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
        }

        .main-content {
            margin-left: 80px;
            padding: 30px;
            transition: margin-left 0.3s ease;
            width: calc(100% - 80px);
        }

        /* Sidebar hover support */
        .sidebar:hover + .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .table-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        h2 {
            font-weight: 700;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<!-- Admin Sidebar Fragment -->
<div th:replace="fragments/adminSidebar :: adminSidebar"></div>

<!-- Main Content -->
<div class="main-content">

    <div class="container">

        <div class="table-box">

            <h2 class="text-center mb-4">
                Pending Registration Requests
            </h2>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Gender</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="user : ${pendingUsers}">

                        <td th:text="${user.id}"></td>

                        <td th:text="${user.name}"></td>

                        <td th:text="${user.email}"></td>

                        <td th:text="${user.mobile}"></td>

                        <td th:text="${user.gender}"></td>

                        <td th:text="${user.role}"></td>

                        <td>
                            <span class="badge bg-warning text-dark"
                                  th:text="${user.status}">
                            </span>
                        </td>

                        <td><a th:href="@{/approveUser/{id}(id=${user.id})}" class="btn btn-success btn-sm"> <i
                                class="fas fa-check"></i> Approve </a> <a
                                th:href="@{/rejectUser/{id}(id=${user.id})}" class="btn btn-danger btn-sm ms-2">
                            <i class="fas fa-times"></i> Reject </a></td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
