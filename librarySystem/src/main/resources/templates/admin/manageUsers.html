<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/adminCSS.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
        }

        .main-content {
            margin-left: 80px;
            padding: 30px;
            transition: margin-left 0.3s ease;
            width: calc(100% - 80px);
        }

        /* Sidebar hover support */
        .sidebar:hover + .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .table-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        h3 {
            font-weight: 700;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div th:replace="fragments/adminSidebar :: adminSidebar"></div>

<div class="main-content">

    <div class="container">

        <div class="table-box">

            <h3 class="text-center mb-4">
                Manage Users
            </h3>

            <div class="mb-4">
                <input id="searchInput"
                       type="text"
                       class="form-control"
                       placeholder="Search students...">
            </div>

            <div class="table-responsive">

                <table class="table table-bordered table-striped text-center">

                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Password</th>
                        <th>Mobile</th>
                        <th>Gender</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody id="studentTable">

                    <tr th:each="u, stat : ${users}">

                        <td th:text="${stat.count}"></td>

                        <td th:text="${u.name}"></td>

                        <td th:text="${u.email}"></td>

                        <td th:text="${u.password}"></td>

                        <td th:text="${u.mobile}"></td>

                        <td th:text="${u.gender}"></td>

                        <td th:text="${u.role}"></td>
                        <td th:text="${u.status}"></td>

                        <td>
                            <div class="d-flex justify-content-center gap-2">

                                <a class="btn btn-warning btn-sm px-3"
                                   th:href="@{/updateUser/{id}(id=${u.id})}">
                                    Update
                                </a>

                                <a class="btn btn-danger btn-sm px-3"
                                   th:href="@{/deleteUsers/{id}(id=${u.id})}">
                                    Delete
                                </a>

                            </div>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const table = document.getElementById("studentTable");

        document.getElementById("searchInput").addEventListener("keyup", function () {

            const searchValue = this.value.toLowerCase();
            const rows = table.querySelectorAll("tr");

            rows.forEach(row => {
                const rowText = row.textContent.toLowerCase();
                row.style.display = rowText.includes(searchValue) ? "" : "none";
            });

        });

    });
</script>

</body>
</html>
